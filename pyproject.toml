[project]
name = "ffe"
version = "0.1.0"
description = "Flat-file ingestion engine: you write the parse function, the framework owns the plumbing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.0",
    "pydantic>=2.7",
    "pyarrow>=16",
    "pyiceberg[sql-sqlite]>=0.7",
    "typer>=0.12",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebook = ["jupyterlab>=4", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6"]

[project.scripts]
ffe = "ffe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffe"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: executes the notebook; deselect with -m 'not slow'"]
